name: Publish compatible preview update

on:
  push:
    branches: ['expo-migration']

jobs:
  get_android_build:
    name: Find compatible Android preview build
    type: get-build
    params:
      platform: android
      profile: preview
      channel: preview
      distribution: internal
      app_version: 0.2.0
      runtime_version: 0.2.0

  publish_android_update:
    name: Publish Android preview update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      branch: preview
      platform: android
