name: Accept MYELIN Mini Hinglish Command

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/accept-myelin-mini-hinglish.yml

permissions:
  contents: read
  actions: read

jobs:
  accept:
    name: Hinglish command acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Export acceptance prompt
        env:
          MYELIN_MINI_EVAL_FILE: training/myelin-mini/acceptance-v1.jsonl
          MYELIN_MINI_EVAL_PROMPTS_OUT: artifacts/myelin-mini/acceptance/prompt.jsonl
        run: npx tsx scripts/export-myelin-mini-eval-prompts.ts

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install MYELIN Mini evaluation stack
        run: python -m pip install -r training/myelin-mini/requirements-train.txt

      - name: Download trained LoRA adapter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts/myelin-mini/trained-adapter
          gh run download 37594519114 \
            --repo "${GITHUB_REPOSITORY}" \
            --name myelin-mini-qwen3.5-0.8b-lora-v1 \
            --dir artifacts/myelin-mini/trained-adapter
          ADAPTER_DIR="$(dirname "$(find artifacts/myelin-mini/trained-adapter -name adapter_config.json -print -quit)")"
          test -n "$ADAPTER_DIR"
          echo "ADAPTER_DIR=$ADAPTER_DIR" >> "$GITHUB_ENV"

      - name: Run exact Hinglish command
        run: >-
          python scripts/infer-myelin-mini-peft.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --adapter "$ADAPTER_DIR"
          --prompts artifacts/myelin-mini/acceptance/prompt.jsonl
          --output artifacts/myelin-mini/acceptance/prediction.jsonl
          --max-new-tokens 320

      - name: Score exact Hinglish command
        run: >-
          npx tsx scripts/score-myelin-mini-predictions.ts
          training/myelin-mini/acceptance-v1.jsonl
          artifacts/myelin-mini/acceptance/prediction.jsonl
          artifacts/myelin-mini/acceptance/report.json
          acceptance
          --enforce

      - name: Print exact prediction
        if: always()
        run: cat artifacts/myelin-mini/acceptance/prediction.jsonl || true

      - name: Upload acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-hinglish-acceptance-v1
          path: artifacts/myelin-mini/acceptance
          if-no-files-found: warn
