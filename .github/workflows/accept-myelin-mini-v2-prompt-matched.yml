name: Accept MYELIN Mini v2 Prompt-Matched

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/accept-myelin-mini-v2-prompt-matched.yml

permissions:
  contents: read
  actions: read

jobs:
  accept_v2:
    name: Prompt-matched Hinglish acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Wait for fast corrective run and download adapter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run watch 37609327089 --repo "${GITHUB_REPOSITORY}" --exit-status
          mkdir -p artifacts/myelin-mini/v2-fast-adapter
          gh run download 37609327089 \
            --repo "${GITHUB_REPOSITORY}" \
            --name myelin-mini-qwen3.5-0.8b-lora-v2-fast \
            --dir artifacts/myelin-mini/v2-fast-adapter
          ADAPTER_DIR="$(dirname "$(find artifacts/myelin-mini/v2-fast-adapter -name adapter_config.json -print -quit)")"
          test -n "$ADAPTER_DIR"
          echo "ADAPTER_DIR=$ADAPTER_DIR" >> "$GITHUB_ENV"

      - name: Export prompt matched to fine-tuning
        env:
          MYELIN_MINI_EVAL_FILE: training/myelin-mini/acceptance-v1.jsonl
          MYELIN_MINI_EVAL_PROMPTS_OUT: artifacts/myelin-mini/prompt-match/prompt.jsonl
          MYELIN_MINI_INCLUDE_SCHEMA: "0"
        run: npx tsx scripts/export-myelin-mini-eval-prompts.ts

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install MYELIN Mini evaluation stack
        run: python -m pip install -r training/myelin-mini/requirements-train.txt

      - name: Run exact Hinglish command
        run: >-
          python scripts/infer-myelin-mini-peft.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --adapter "$ADAPTER_DIR"
          --prompts artifacts/myelin-mini/prompt-match/prompt.jsonl
          --output artifacts/myelin-mini/prompt-match/prediction.jsonl
          --max-new-tokens 384

      - name: Enforce semantic acceptance
        run: >-
          npx tsx scripts/score-myelin-mini-predictions.ts
          training/myelin-mini/acceptance-v1.jsonl
          artifacts/myelin-mini/prompt-match/prediction.jsonl
          artifacts/myelin-mini/prompt-match/report.json
          acceptance
          --enforce

      - name: Print prediction
        if: always()
        run: cat artifacts/myelin-mini/prompt-match/prediction.jsonl || true

      - name: Upload acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-v2-prompt-matched-acceptance
          path: artifacts/myelin-mini/prompt-match
          if-no-files-found: warn
