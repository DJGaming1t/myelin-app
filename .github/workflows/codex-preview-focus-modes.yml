name: Publish Focus modes preview
on:
  push:
    branches: [codex/preview-focus-modes-3b4dfdf]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3b4dfdf2f5001d0c6ea26706763f7728b07d1700
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source and runtime
        run: |
          test -n "$EXPO_TOKEN"
          test "$(git rev-parse HEAD)" = "3b4dfdf2f5001d0c6ea26706763f7728b07d1700"
          test -z "$(git status --porcelain)"
          node -e "const a=require('./app.json').expo; if(a.version!=='0.2.20'||a.runtimeVersion.policy!=='appVersion'||a.extra.eas.projectId!=='2171936c-83f9-459f-9bb6-dddc4768484e') process.exit(1)"
      - run: node --import tsx scripts/verify-focus-modes.ts
      - name: Publish Android preview only
        run: npx eas-cli@latest update --channel preview --environment preview --platform android --non-interactive --message "Focus modes 3b4dfdf2f5001d0c6ea26706763f7728b07d1700"
