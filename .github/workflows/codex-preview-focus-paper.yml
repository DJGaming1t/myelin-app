name: Publish Focus paper preview
on:
  push:
    branches: [codex/preview-focus-paper-3bd4ef1]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3bd4ef1999894bc9cfe16233529f9fa2c5208b05
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source and runtime
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          test "$(git rev-parse HEAD)" = "3bd4ef1999894bc9cfe16233529f9fa2c5208b05"
          test -z "$(git status --porcelain)"
          node -e "const a=require('./app.json').expo; if(a.version!=='0.2.20'||a.runtimeVersion.policy!=='appVersion'||a.extra.eas.projectId!=='2171936c-83f9-459f-9bb6-dddc4768484e') process.exit(1)"
      - name: Publish Android preview only
        run: >-
          npx eas-cli@latest update --channel preview --environment preview --platform android --non-interactive
          --message "Focus paper 3bd4ef1999894bc9cfe16233529f9fa2c5208b05"
