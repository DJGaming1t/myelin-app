name: Publish Android viewport fix to preview
on:
  push:
    branches: [codex/preview-height-9ce]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9ce798cab9de28a4af8394e4999be70b0d3ea71a
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source and runtime
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          test "$(git rev-parse HEAD)" = "9ce798cab9de28a4af8394e4999be70b0d3ea71a"
          test -z "$(git status --porcelain)"
          node -e "const a=require('./app.json').expo; if(a.version!=='0.2.20'||a.runtimeVersion.policy!=='appVersion'||a.extra.eas.projectId!=='2171936c-83f9-459f-9bb6-dddc4768484e') process.exit(1)"
      - name: Publish Android preview only
        run: >-
          npx eas-cli@latest update
          --channel preview
          --environment preview
          --platform android
          --non-interactive
          --message "Android 3D height fix 9ce798cab9de28a4af8394e4999be70b0d3ea71a"
