name: Publish authorized Android preview
on:
  push:
    branches: [codex/preview-check-cad95]
    paths: [.github/workflows/codex-preview-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cad95bafe4c655a3281797b554e0a4209701910b
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify exact source and runtime
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          test "$(git rev-parse HEAD)" = "cad95bafe4c655a3281797b554e0a4209701910b"
          test -z "$(git status --porcelain)"
          node -e "const a=require('./app.json').expo; if(a.version!=='0.2.20'||a.runtimeVersion.policy!=='appVersion'||a.extra.eas.projectId!=='2171936c-83f9-459f-9bb6-dddc4768484e') process.exit(1)"
          echo "Verified exact clean commit and runtime 0.2.20"
      - name: Publish Android preview only
        run: >-
          npx eas-cli@latest update
          --channel preview
          --environment preview
          --platform android
          --non-interactive
          --message "Android preview cad95bafe4c655a3281797b554e0a4209701910b"
