name: Complete original Qwen reference after metadata serialization fix

on:
  workflow_dispatch:
  push:
    branches: [codex/exam-autopilot-capacity-v1]
    paths: [.github/workflows/compare-assistant-reference-original.yml]

permissions:
  contents: read

concurrency:
  group: myelin-original-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check unchanged probes and load-metadata adapter
        run: |
          python scripts/test-assistant-capability.py
          python scripts/test-assistant-diagnostic.py
          python scripts/test-assistant-reference.py
          python -m py_compile scripts/run-assistant-reference.py
      - name: Install exact original CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install transformers==5.3.0 huggingface-hub==1.3.0
          mkdir -p artifacts/assistant-reference/original
          python -m pip freeze > artifacts/assistant-reference/original/packages.txt
      - name: Run original condition once with unchanged cases and settings
        run: timeout --signal=TERM --kill-after=15s 40m python -u scripts/run-assistant-reference.py --runner original --output artifacts/assistant-reference/original
      - name: Preserve all original outputs and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-reference-original-corrected
          path: artifacts/assistant-reference/original
          if-no-files-found: warn
          retention-days: 90
