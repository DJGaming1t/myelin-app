name: Compare original Qwen with phone conversion and prompt paths

on:
  workflow_dispatch:
  push:
    branches: [codex/exam-autopilot-capacity-v1]
    paths: [.github/workflows/compare-assistant-reference.yml]

permissions:
  contents: read

concurrency:
  group: myelin-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Qwen 2B reference ${{ matrix.runner }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [original, native]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      REFERENCE_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check frozen probes and exact response adapters
        run: |
          python scripts/test-assistant-capability.py
          python scripts/test-assistant-diagnostic.py
          python scripts/test-assistant-reference.py
          python -m py_compile scripts/run-assistant-reference.py
      - name: Install pinned CPU reference and native runtimes
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install transformers==5.3.0 huggingface-hub==1.3.0 litert-lm-api==0.18.0
          mkdir -p "artifacts/assistant-reference/$REFERENCE_RUNNER"
          python -m pip freeze > "artifacts/assistant-reference/$REFERENCE_RUNNER/packages.txt"
      - name: Run all declared reference conditions once
        run: timeout --signal=TERM --kill-after=15s 40m python -u scripts/run-assistant-reference.py --runner "$REFERENCE_RUNNER" --output "artifacts/assistant-reference/$REFERENCE_RUNNER"
      - name: Preserve every response and partial native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-reference-${{ matrix.runner }}
          path: artifacts/assistant-reference/${{ matrix.runner }}
          if-no-files-found: warn
          retention-days: 90
