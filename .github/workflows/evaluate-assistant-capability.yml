name: Compare actual Qwen phone bundles for assistant capability

on:
  workflow_dispatch:
  push:
    branches: [codex/exam-autopilot-capacity-v1]
    paths: [.github/workflows/evaluate-assistant-capability.yml]

permissions:
  contents: read

concurrency:
  group: myelin-assistant-capability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: ${{ matrix.candidate }} on Linux CPU
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        candidate: [qwen35-lite-int8, qwen35-enhanced-int8]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify frozen inputs and strict scorer before model inference
        run: python scripts/test-assistant-capability.py
      - name: Install pinned native model runner
        run: |
          python -m pip install litert-lm==0.18.0 huggingface-hub==1.1.7
          mkdir -p "artifacts/assistant-capability/$CANDIDATE"
          python -m pip freeze > "artifacts/assistant-capability/$CANDIDATE/packages.txt"
          litert-lm --help
          litert-lm serve --help
      - name: Record installed app wrapper's native dependency without changing it
        run: |
          python - <<'PYTHON'
          import io, json, tarfile, urllib.request
          from pathlib import Path
          metadata=json.load(urllib.request.urlopen('https://registry.npmjs.org/react-native-litert-lm/0.7.0',timeout=30))
          data=urllib.request.urlopen(metadata['dist']['tarball'],timeout=60).read()
          import hashlib, base64, os
          assert metadata['dist']['integrity']=='sha512-'+base64.b64encode(hashlib.sha512(data).digest()).decode()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              names=[name for name in archive.getnames() if name.endswith(('build.gradle','gradle.properties','libs.versions.toml')) or name=='package/package.json']
              contents={name:archive.extractfile(name).read().decode() for name in names}
          sdk=json.loads(contents['package/package.json'])['litertLm']
          report={'package':'react-native-litert-lm','version':'0.7.0','npmIntegrity':metadata['dist']['integrity'],'nativeSdk':sdk,'nativeFiles':contents,'limit':'Source dependency audit only; not the installed APK dependency resolution or Android execution.'}
          path=Path('artifacts/assistant-capability')/os.environ['CANDIDATE']/'app-runtime-audit.json'
          path.write_text(json.dumps(report,indent=2)+'\n')
          print('EVIDENCE_BEGIN app-runtime-audit.json');print(path.read_text());print('EVIDENCE_END app-runtime-audit.json')
          PYTHON
      - name: Download exact bundle, verify digest, run actual model on every frozen case once
        run: python -u scripts/run-assistant-capability.py --candidate "$CANDIDATE" --output "artifacts/assistant-capability/$CANDIDATE"
      - name: Preserve evidence on quality or runtime failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-capability-${{ matrix.candidate }}
          path: artifacts/assistant-capability/${{ matrix.candidate }}
          if-no-files-found: warn
          retention-days: 90
