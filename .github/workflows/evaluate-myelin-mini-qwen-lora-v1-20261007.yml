name: Evaluate MYELIN Mini Qwen LoRA v1

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/evaluate-myelin-mini-qwen-lora-v1-20261007.yml

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Evaluate trained Qwen 0.8B adapter
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MYELIN Mini dataset
        run: npm run build:myelin-mini-dataset

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install MYELIN Mini inference stack
        run: python -m pip install -r training/myelin-mini/requirements-train.txt

      - name: Download trained LoRA adapter
        uses: actions/download-artifact@v4
        with:
          name: myelin-mini-qwen3.5-0.8b-lora-v1
          path: artifacts/trained-adapter
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37594519114

      - name: Verify downloaded adapter
        run: |
          test -f artifacts/trained-adapter/adapter_model.safetensors
          test -f artifacts/trained-adapter/adapter_config.json
          test -f artifacts/trained-adapter/training-manifest.json

      - name: Prepare Hinglish acceptance case
        run: |
          mkdir -p artifacts/myelin-mini/lora-v1
          grep '"id":"e18-hinglish"' training/myelin-mini/eval-v1.jsonl > artifacts/myelin-mini/lora-v1/acceptance-eval.jsonl
          test -s artifacts/myelin-mini/lora-v1/acceptance-eval.jsonl

      - name: Run Hinglish acceptance inference
        run: >-
          python scripts/infer-myelin-mini-lora.py
          --base-model principled-intelligence/Qwen3.5-0.8B-text-only
          --adapter artifacts/trained-adapter
          --eval-file artifacts/myelin-mini/lora-v1/acceptance-eval.jsonl
          --predictions-out artifacts/myelin-mini/lora-v1/acceptance-predictions.jsonl
          --max-new-tokens 384

      - name: Score Hinglish acceptance
        run: >-
          npx tsx scripts/score-myelin-mini-predictions.ts
          artifacts/myelin-mini/lora-v1/acceptance-eval.jsonl
          artifacts/myelin-mini/lora-v1/acceptance-predictions.jsonl
          artifacts/myelin-mini/lora-v1/acceptance-report.json
          acceptance

      - name: Run full untouched hold-out inference
        run: >-
          python scripts/infer-myelin-mini-lora.py
          --base-model principled-intelligence/Qwen3.5-0.8B-text-only
          --adapter artifacts/trained-adapter
          --eval-file training/myelin-mini/eval-v1.jsonl
          --predictions-out artifacts/myelin-mini/lora-v1/full-predictions.jsonl
          --max-new-tokens 384

      - name: Score full hold-out
        run: >-
          npx tsx scripts/score-myelin-mini-predictions.ts
          training/myelin-mini/eval-v1.jsonl
          artifacts/myelin-mini/lora-v1/full-predictions.jsonl
          artifacts/myelin-mini/lora-v1/full-report.json
          release

      - name: Print acceptance prediction
        if: always()
        run: |
          echo "=== Acceptance prediction ==="
          cat artifacts/myelin-mini/lora-v1/acceptance-predictions.jsonl || true
          echo "=== Acceptance report ==="
          cat artifacts/myelin-mini/lora-v1/acceptance-report.json || true
          echo "=== Full report ==="
          cat artifacts/myelin-mini/lora-v1/full-report.json || true

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-qwen3.5-0.8b-lora-v1-evaluation
          path: artifacts/myelin-mini/lora-v1
          if-no-files-found: warn
