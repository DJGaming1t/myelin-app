name: Preflight MYELIN Mini balanced training

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/preflight-myelin-mini.yml
      - scripts/myelin_mini_training_audit.py
      - scripts/build-myelin-mini-balanced.py
      - scripts/audit-myelin-mini-recipes.py
      - scripts/verify-myelin-mini-training.py
      - scripts/verify-myelin-mini-sft.py
      - scripts/train-myelin-mini-qwen.py
      - scripts/build-myelin-mini-dataset.ts
      - scripts/verify-myelin-mini-curriculum.ts
      - src/features/assistant/myelin-mini-evaluation.ts
      - training/myelin-mini/curriculum-v3.jsonl
      - training/myelin-mini/eval-v2.jsonl
      - training/myelin-mini/eval-v2-manifest.json

permissions:
  contents: read

concurrency:
  group: myelin-mini-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt
      - name: Build balanced candidate and historical audit inputs
        run: |
          npm ci --no-audit --no-fund
          npm run build:myelin-mini-dataset
          npx tsx scripts/verify-myelin-mini-curriculum.ts
          npx tsx scripts/verify-myelin-mini.ts
          npx tsx scripts/build-myelin-mini-router-v2.ts
          python scripts/build-myelin-mini-balanced.py
          python scripts/verify-myelin-mini-training.py
          npx tsc --noEmit
      - name: Install CPU training stack for preprocessing integration check
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r training/myelin-mini/requirements-train.txt
      - name: Measure historical recipe lengths and prompt alignment
        run: python scripts/audit-myelin-mini-recipes.py
      - name: Enforce balanced candidate preflight before loading model weights
        run: >-
          python scripts/train-myelin-mini-qwen.py
          --train training/myelin-mini/compiled/balanced-v3-train.jsonl
          --validation training/myelin-mini/compiled/balanced-v3-validation.jsonl
          --max-length 768
          --preflight-only
          --audit-output artifacts/myelin-mini/training-audit/candidate-preflight.json
      - name: Verify actual TRL preprocessing and completion masks
        run: python scripts/verify-myelin-mini-sft.py
      - name: Save dataset manifest
        if: always()
        run: |
          mkdir -p artifacts/myelin-mini/training-audit
          cp training/myelin-mini/compiled/balanced-v3-manifest.json artifacts/myelin-mini/training-audit/
      - name: Upload training audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-training-preflight
          path: artifacts/myelin-mini/training-audit
          if-no-files-found: error
