name: Publish preview OTA

on:
  workflow_run:
    workflows: ['Verify Expo app']
    types: [completed]
    branches: [expo-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-ota
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo token
        id: token
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not configured; preview OTA publishing was skipped."
          fi

      - name: Resolve verified commit
        if: steps.token.outputs.configured == 'true'
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified commit
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Use Node.js 24
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.token.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Publish Android preview update
        if: steps.token.outputs.configured == 'true'
        run: >
          npx eas-cli@latest update
          --channel preview
          --environment preview
          --platform android
          --non-interactive
          --message "Verified preview ${{ steps.ref.outputs.sha }}"
