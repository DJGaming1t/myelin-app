name: Publish MYELIN preview update

on:
  push:
    branches:
      - expo-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect native-sensitive changes since preview baseline
        id: native
        shell: bash
        run: |
          BASELINE="$(tr -d '\r\n' < .eas/preview-native-baseline.txt)"
          if [ -z "$BASELINE" ] || ! git cat-file -e "$BASELINE^{commit}" 2>/dev/null; then
            echo "Preview native baseline is missing or invalid."
            exit 1
          fi

          echo "Preview native baseline: $BASELINE"
          CHANGED="$(git diff --name-only "$BASELINE" HEAD || true)"
          echo "$CHANGED"

          REQUIRES_BUILD=false

          if echo "$CHANGED" | grep -Eq '^(app\.json|eas\.json|package-lock\.json|google-services\.json|android/|ios/)'; then
            REQUIRES_BUILD=true
          fi

          if echo "$CHANGED" | grep -qx 'package.json'; then
            git show "$BASELINE:package.json" > /tmp/base-package.json
            node scripts/check-native-package-change.cjs /tmp/base-package.json package.json || REQUIRES_BUILD=true
          fi

          echo "requires_build=$REQUIRES_BUILD" >> "$GITHUB_OUTPUT"

      - name: Explain native-build requirement
        if: steps.native.outputs.requires_build == 'true'
        run: |
          echo "Native-sensitive files changed since the preview APK baseline, so this branch is not OTA-compatible with that installed binary."
          echo "Create a new preview APK with: npm run eas:preview"
          echo "After verifying that APK, advance .eas/preview-native-baseline.txt to the commit that produced it."

      - name: Expo token not configured yet
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN == ''
        run: |
          echo "EXPO_TOKEN is not configured in GitHub Actions yet."
          echo "Add it as a repository secret named EXPO_TOKEN to enable automatic preview updates."

      - name: Use Node.js
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Use Java for verification
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup EAS
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN != ''
        run: npm ci --no-audit --no-fund

      - name: Verify update-safe source
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN != ''
        run: |
          npx tsc --noEmit
          npm run verify:auth
          npm run verify:data
          npm run verify:topics
          npm run verify:today
          npm run verify:planning
          npm run verify:focus
          npm run verify:review
          npm run verify:mistakes
          npm run verify:exams
          npm run verify:progress
          npm run verify:settings
          npm run verify:transfer
          npm run verify:cloud
          npm run verify:firestore-rules
          npm run verify:notifications
          npm run verify:onboarding
          npm run verify:polish
          npm run verify:release
          npx expo-doctor

      - name: Publish to preview channel
        if: steps.native.outputs.requires_build != 'true' && env.EXPO_TOKEN != ''
        run: eas update --channel preview --environment preview --message "Auto preview ${GITHUB_SHA::7}" --non-interactive
