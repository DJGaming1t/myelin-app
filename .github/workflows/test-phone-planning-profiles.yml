name: Test converted phone planning model with bounded reasoning

on:
  workflow_dispatch:
  push:
    branches: [codex/exam-autopilot-capacity-v1]
    paths: [.github/workflows/test-phone-planning-profiles.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: myelin-phone-planning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PHONE_LLAMA_COMMIT: 6c8dcaa7ae41fa9f4aa2b3b68ee82cb8b2a03632
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify frozen fresh and unchanged regression inputs
        run: |
          python -m py_compile scripts/run-assistant-phone-profiles.py
          PYTHONPATH=scripts python -c 'from runpy import run_path; run_path("scripts/run-assistant-phone-profiles.py")["load"]()'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11618830746
          run-id: 37933683037
          github-token: ${{ github.token }}
          path: artifacts/phone-model
          merge-multiple: true
      - name: Install pinned tokenizer/runtime helpers
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install transformers==5.3.0 huggingface-hub==1.3.0
          mkdir -p artifacts/phone-profiles
          python -m pip freeze > artifacts/phone-profiles/packages.txt
      - name: Build exact backend used by llama.rn 0.12.9
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$PHONE_LLAMA_COMMIT"
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "$PHONE_LLAMA_COMMIT"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 2
      - name: Run both declared profiles once
        run: >
          timeout --signal=TERM --kill-after=15s 30m python -u scripts/run-assistant-phone-profiles.py
          --models artifacts/phone-model --llama "$RUNNER_TEMP/llama.cpp"
          --output artifacts/phone-profiles
      - name: Preserve every final answer, reasoning envelope and runtime trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYELIN-phone-planning-profiles-evidence
          path: artifacts/phone-profiles
          if-no-files-found: warn
          retention-days: 90
