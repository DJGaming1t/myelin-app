name: Test already converted stronger phone planning candidate

on:
  workflow_dispatch:
  push:
    branches: [codex/exam-autopilot-capacity-v1]
    paths: [.github/workflows/test-stronger-phone-planning.yml]

permissions:
  contents: read

concurrency:
  group: myelin-stronger-phone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PHONE_LLAMA_COMMIT: 6c8dcaa7ae41fa9f4aa2b3b68ee82cb8b2a03632
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate frozen inputs before downloading or inference
        run: python scripts/test-assistant-stronger-phone.py
      - name: Install pinned tokenizer helpers
        run: |
          python -m pip install transformers==5.3.0 huggingface-hub==1.3.0 jinja2==3.1.6
          mkdir -p artifacts/stronger-phone
          python -m pip freeze > artifacts/stronger-phone/packages.txt
      - name: Preflight official tokenizer templates before building
        run: python scripts/run-assistant-stronger-phone.py --preflight
      - name: Build pinned phone backend on CPU
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$PHONE_LLAMA_COMMIT"
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "$PHONE_LLAMA_COMMIT"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j 2
      - name: Verify already-converted hash and run both profiles once
        run: >
          timeout --signal=TERM --kill-after=15s 45m python -u scripts/run-assistant-stronger-phone.py
          --llama "$RUNNER_TEMP/llama.cpp" --output artifacts/stronger-phone
      - name: Preserve all answers, reasoning and provenance even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MYELIN-stronger-phone-planning-evidence
          path: artifacts/stronger-phone
          if-no-files-found: warn
          retention-days: 90
