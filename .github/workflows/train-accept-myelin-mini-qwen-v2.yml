name: Train and Accept MYELIN Mini Qwen v2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/train-accept-myelin-mini-qwen-v2.yml

permissions:
  contents: read

jobs:
  train_accept:
    name: Focused Hinglish router LoRA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build expanded MYELIN Mini SFT dataset
        run: npm run build:myelin-mini-dataset

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install MYELIN Mini training stack
        run: python -m pip install -r training/myelin-mini/requirements-train.txt

      - name: Train focused command-router LoRA
        run: >-
          python scripts/train-myelin-mini-qwen.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --output artifacts/myelin-mini/qwen3.5-0.8b-lora-v2
          --epochs 3
          --max-steps 36
          --learning-rate 0.0003
          --batch-size 1
          --gradient-accumulation 1
          --max-length 768
          --allow-cpu
          --skip-eval
          --no-gradient-checkpointing

      - name: Run Hinglish acceptance gate
        id: acceptance
        continue-on-error: true
        run: >-
          python scripts/evaluate-myelin-mini-acceptance.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --adapter artifacts/myelin-mini/qwen3.5-0.8b-lora-v2
          --compiled-train training/myelin-mini/compiled/train-v1.jsonl
          --min-pass 5
          --report artifacts/myelin-mini/qwen3.5-0.8b-lora-v2/acceptance-report.json

      - name: Show acceptance report
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/myelin-mini/qwen3.5-0.8b-lora-v2/acceptance-report.json ]; then
            cat artifacts/myelin-mini/qwen3.5-0.8b-lora-v2/acceptance-report.json
          fi

      - name: Upload trained adapter and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-qwen3.5-0.8b-lora-v2
          path: artifacts/myelin-mini/qwen3.5-0.8b-lora-v2
          if-no-files-found: warn

      - name: Enforce 5 of 5 acceptance
        if: steps.acceptance.outcome != 'success'
        run: exit 2
