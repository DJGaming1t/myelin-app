name: Train and Accept MYELIN Mini Qwen v3

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/train-accept-myelin-mini-qwen-v3.yml

permissions:
  contents: read

jobs:
  train_accept:
    name: Ultra-focused Hinglish router LoRA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build MYELIN Mini datasets
        run: |
          npm run build:myelin-mini-dataset
          npx tsx scripts/build-myelin-mini-router-focus.ts

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install MYELIN Mini training stack
        run: python -m pip install -r training/myelin-mini/requirements-train.txt

      - name: Train ultra-focused router LoRA
        run: >-
          python scripts/train-myelin-mini-qwen.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --train training/myelin-mini/compiled/router-train-v1.jsonl
          --validation training/myelin-mini/compiled/router-validation-v1.jsonl
          --output artifacts/myelin-mini/qwen3.5-0.8b-lora-v3
          --epochs 2
          --max-steps 16
          --learning-rate 0.0006
          --batch-size 1
          --gradient-accumulation 1
          --max-length 640
          --allow-cpu
          --skip-eval
          --no-gradient-checkpointing

      - name: Run Hinglish acceptance gate
        id: acceptance
        continue-on-error: true
        run: >-
          python scripts/evaluate-myelin-mini-acceptance.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --adapter artifacts/myelin-mini/qwen3.5-0.8b-lora-v3
          --compiled-train training/myelin-mini/compiled/train-v1.jsonl
          --min-pass 5
          --report artifacts/myelin-mini/qwen3.5-0.8b-lora-v3/acceptance-report.json

      - name: Show acceptance report
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/myelin-mini/qwen3.5-0.8b-lora-v3/acceptance-report.json ]; then
            cat artifacts/myelin-mini/qwen3.5-0.8b-lora-v3/acceptance-report.json
          fi

      - name: Upload trained adapter and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-qwen3.5-0.8b-lora-v3
          path: artifacts/myelin-mini/qwen3.5-0.8b-lora-v3
          if-no-files-found: warn

      - name: Enforce 5 of 5 acceptance
        if: steps.acceptance.outcome != 'success'
        run: exit 2
