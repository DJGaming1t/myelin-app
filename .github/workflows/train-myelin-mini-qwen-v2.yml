name: Train MYELIN Mini Qwen v2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/exam-autopilot-capacity-v1
    paths:
      - .github/workflows/train-myelin-mini-qwen-v2.yml

permissions:
  contents: read
  actions: read

jobs:
  train:
    name: Qwen3.5 0.8B LoRA v2 focused correction
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/myelin-mini/requirements-train.txt

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build focused v2 correction dataset
        run: npx tsx scripts/build-myelin-mini-v2-focus.ts

      - name: Download v1 adapter
        uses: actions/download-artifact@v4
        with:
          name: myelin-mini-qwen3.5-0.8b-lora-v1
          path: artifacts/myelin-mini/qwen3.5-0.8b-lora-v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37594519114

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0

      - name: Install MYELIN Mini training stack
        run: python -m pip install -r training/myelin-mini/requirements-train.txt

      - name: Train focused correction adapter
        run: >-
          python scripts/train-myelin-mini-qwen.py
          --model principled-intelligence/Qwen3.5-0.8B-text-only
          --train training/myelin-mini/compiled/focus-v2-train.jsonl
          --validation training/myelin-mini/compiled/focus-v2-validation.jsonl
          --resume-adapter artifacts/myelin-mini/qwen3.5-0.8b-lora-v1
          --output artifacts/myelin-mini/qwen3.5-0.8b-lora-v2
          --epochs 2
          --learning-rate 0.0001
          --batch-size 1
          --gradient-accumulation 2
          --max-length 768
          --allow-cpu
          --allow-small-dataset
          --no-gradient-checkpointing

      - name: Verify v2 adapter
        shell: bash
        run: |
          test -f artifacts/myelin-mini/qwen3.5-0.8b-lora-v2/training-manifest.json
          test -f artifacts/myelin-mini/qwen3.5-0.8b-lora-v2/adapter_model.safetensors
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/myelin-mini/qwen3.5-0.8b-lora-v2")
          manifest = json.loads((root / "training-manifest.json").read_text())
          assert manifest["runTrainRows"] == 24
          assert manifest["runValidationRows"] == 6
          assert manifest["allowSmallDataset"] is True
          assert manifest["resumeAdapter"]
          assert isinstance(manifest["metrics"].get("train_loss"), (int, float))
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload v2 adapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myelin-mini-qwen3.5-0.8b-lora-v2
          path: artifacts/myelin-mini/qwen3.5-0.8b-lora-v2
          if-no-files-found: warn
