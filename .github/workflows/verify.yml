name: Verify Expo app

on:
  pull_request:
    branches:
      - expo-migration
  push:
    branches:
      - expo-migration
      - codex/exam-autopilot-capacity-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Native runtime boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-native-runtime-boundary.cjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Use Java for Firebase emulators
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/expo-migration' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Authentication configuration
        run: npm run verify:auth

      - name: Data isolation and recovery
        run: npm run verify:data

      - name: Topic CRUD and reference integrity
        run: npm run verify:topics

      - name: Today planner priorities and time realism
        run: npm run verify:today

      - name: Study tasks, Day Map and rescheduling
        run: npm run verify:planning

      - name: Focus recovery and timer behavior
        run: npm run verify:focus

      - name: Active recall queue and scheduling
        run: npm run verify:review

      - name: Adaptive memory, sleep, outcomes and confusion practice
        run: npx tsx scripts/verify-adaptive.ts

      - name: Mistake notebook capture and retest loop
        run: npm run verify:mistakes

      - name: Exam scope and planner pressure
        run: npm run verify:exams

      - name: Exam capacity, safe buffers and workload strain
        run: npm run verify:exam-plan

      - name: Assistant action protocol and safety boundary
        run: npm run verify:assistant-actions

      - name: Local AI model manager lifecycle
        run: npm run verify:local-ai

      - name: Progress and calibration evidence
        run: npm run verify:progress

      - name: Settings and privacy guardrails
        run: npm run verify:settings

      - name: Backup, import and web migration
        run: npm run verify:transfer

      - name: Cloud sync conflict and snapshot integrity
        run: npm run verify:cloud

      - name: Firestore per-user security rules
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/expo-migration' }}
        run: npm run verify:firestore-rules

      - name: Notification planning, quiet hours and copy guardrails
        run: npm run verify:notifications

      - name: First-run onboarding gates and setup
        run: npm run verify:onboarding

      - name: Transition routing and circle handoff
        run: npx tsx scripts/verify-transition.ts

      - name: Product polish, accessibility and responsive shell
        run: npm run verify:polish

      - name: Release engineering configuration
        run: npm run verify:release

      - name: Visual system and motion regression
        run: npm run verify:visual

      - name: Fast PR verification complete
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Fast PR gate passed. Firebase security rules and native Android generation run after merge before preview OTA publishing."

      - name: Use Java for local AI native checks
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/exam-autopilot-capacity-v1' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Android project for MYELIN LiteRT bridge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/exam-autopilot-capacity-v1' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile MYELIN LiteRT bridge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/exam-autopilot-capacity-v1' }}
        run: cd android && ./gradlew :myelin-litertlm:compileDebugKotlin --no-daemon

      - name: Install maintained LiteRT wrapper in CI sandbox
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/exam-autopilot-capacity-v1' }}
        shell: bash
        run: |
          rm -rf modules/myelin-litertlm
          npm install react-native-litert-lm@0.7.0 --no-save --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.plugins ||= [];
          if (!app.expo.plugins.includes('react-native-litert-lm')) {
            app.expo.plugins.push('react-native-litert-lm');
          }
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Generate Android project for maintained LiteRT wrapper
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/exam-autopilot-capacity-v1' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile maintained LiteRT wrapper
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/exam-autopilot-capacity-v1' }}
        run: cd android && ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Expo Doctor
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/expo-migration' }}
        run: npx expo-doctor

      - name: Validate Expo native config
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/expo-migration' }}
        run: npx expo config --type prebuild > /dev/null

      - name: Generate Android project
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/expo-migration' }}
        run: npx expo prebuild --platform android --clean --no-install

  publish_preview:
    name: Publish preview OTA
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/expo-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo token
        id: token
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not configured; preview OTA publishing was skipped."
          fi

      - name: Checkout verified commit
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Use Node.js 24
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Publish Android preview update
        if: steps.token.outputs.configured == 'true'
        run: >
          npx eas-cli@latest update
          --channel preview
          --environment preview
          --platform android
          --non-interactive
          --message "Verified preview $GITHUB_SHA"
