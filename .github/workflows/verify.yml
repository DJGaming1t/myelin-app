name: Verify Expo app

on:
  pull_request:
    branches:
      - expo-migration
  push:
    branches:
      - feature/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Use Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Data isolation and recovery
        run: npm run verify:data

      - name: Topic CRUD and reference integrity
        run: npm run verify:topics

      - name: Today planner priorities and time realism
        run: npm run verify:today

      - name: Focus recovery and timer behavior
        run: npm run verify:focus

      - name: Active recall queue and scheduling
        run: npm run verify:review

      - name: Mistake notebook capture and retest loop
        run: npm run verify:mistakes

      - name: Exam scope and planner pressure
        run: npm run verify:exams

      - name: Progress and calibration evidence
        run: npm run verify:progress

      - name: Settings and privacy guardrails
        run: npm run verify:settings

      - name: Backup, import and web migration
        run: npm run verify:transfer

      - name: Cloud sync conflict and snapshot integrity
        run: npm run verify:cloud

      - name: Firestore per-user security rules
        run: npm run verify:firestore-rules

      - name: Notification planning, quiet hours and copy guardrails
        run: npm run verify:notifications

      - name: First-run onboarding gates and setup
        run: npm run verify:onboarding

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate Expo native config
        run: npx expo config --type prebuild > /dev/null

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
