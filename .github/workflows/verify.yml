name: Verify Expo app

on:
  pull_request:
    branches:
      - expo-migration
  push:
    branches:
      - feature/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate Expo native config
        run: npx expo config --type prebuild > /dev/null

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
