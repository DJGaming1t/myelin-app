gradle.beforeProject { project ->
    // Gradle's worker limit does not limit Metro's separate Node worker pool.
    project.plugins.withId('com.facebook.react') {
        project.extensions.getByName('react').extraPackagerArgs.addAll(['--max-workers', '2'])
    }
    ['com.android.application', 'com.android.library'].each { pluginId ->
        project.plugins.withId(pluginId) {
            project.extensions.getByName('android').defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                '-DCMAKE_JOB_POOLS=myelin_compile=2',
                '-DCMAKE_JOB_POOL_COMPILE=myelin_compile',
                '-DCMAKE_JOB_POOL_LINK=myelin_compile'
            ])
        }
    }
}
